<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FitTracker Pro iOS</title>
  
  <!-- Configuración Web App iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="IronLog">
  <link rel="apple-touch-icon" href="https://img.icons8.com/isometric/180/dumbbell.png">

  <!-- Estilos Adaptados a iOS Dark Theme -->
  <style>
    :root {
      --bg: #000000;
      --card-bg: #1c1c1e;
      --card-inner: #2c2c2e;
      --accent: #0a84ff;
      --accent-green: #30d158;
      --accent-orange: #ff9f0a;
      --accent-red: #ff453a;
      --text: #ffffff;
      --text-sub: #8e8e93;
      --border: #38383a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 90px; min-height: 100vh; -webkit-user-select: none; }
    
    /* Header fijo */
    header { background: rgba(28,28,30,0.8); backdrop-filter: blur(20px); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); padding: 16px; text-align: center; }
    header h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }

    /* Contenedor de Secciones */
    .container { padding: 16px; max-width: 600px; margin: 0 auto; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Tarjetas */
    .card { background: var(--card-bg); border-radius: 14px; padding: 16px; margin-bottom: 16px; border: 1px solid var(--border); }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .card-title { font-size: 13px; font-weight: 600; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.5px; }

    /* Formulario e Inputs */
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 13px; color: var(--text-sub); margin-bottom: 6px; }
    input, select { width: 100%; background: var(--card-inner); border: 1px solid var(--border); color: var(--text); padding: 12px; border-radius: 10px; font-size: 16px; outline: none; appearance: none; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

    /* Botones */
    button { width: 100%; background: var(--accent); color: white; border: none; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: opacity 0.1s; }
    button:active { opacity: 0.6; }
    .btn-secondary { background: var(--card-inner); border: 1px solid var(--border); color: var(--text); }
    .btn-danger { background: rgba(255,69,58,0.15); color: var(--accent-red); border: 1px solid var(--accent-red); }
    .btn-small { padding: 8px 12px; font-size: 12px; border-radius: 8px; width: auto; }

    /* Display de Datos y Calculadoras */
    .calc-box { background: var(--card-inner); border-radius: 10px; padding: 12px; text-align: center; margin: 10px 0; border: 1px dashed var(--border); }
    .calc-box .val { font-size: 24px; font-weight: 800; color: var(--accent-green); }

    /* Cronómetro */
    .timer-display { font-size: 42px; font-weight: 800; text-align: center; font-mono: true; color: var(--accent-orange); margin: 10px 0; letter-spacing: 1px; }

    /* Historial e Items */
    .log-item { background: var(--card-inner); border-radius: 10px; padding: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid var(--accent); }
    .log-info h3 { font-size: 16px; font-weight: 600; margin-bottom: 2px; }
    .log-info p { font-size: 13px; color: var(--text-sub); }
    .log-stats { text-align: right; }
    .log-weight { font-size: 16px; font-weight: 700; color: var(--accent-green); }
    .log-sub { font-size: 11px; color: var(--text-sub); }

    /* Barra de Navegación Inferior Estilo iOS */
    nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(28,28,30,0.92); backdrop-filter: blur(20px); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 10px 0 25px; z-index: 1000; }
    .nav-item { background: none; border: none; color: var(--text-sub); display: flex; flex-direction: column; align-items: center; font-size: 10px; gap: 4px; padding: 0; width: auto; }
    .nav-item.active { color: var(--accent); }
    .nav-item svg { width: 22px; height: 22px; fill: currentColor; }

    /* Desglose de discos */
    .plates-container { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 8px; }
    .plate-badge { background: var(--accent); color: white; padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: 700; }
  </style>
</head>
<body>

  <header>
    <h1 id="pageTitle">Registrar Serie</h1>
  </header>

  <div class="container">

    <!-- TAB 1: REGISTRO DE ENTRENAMIENTO -->
    <div id="tab-log" class="tab-content active">
      
      <!-- Cronómetro Rápido -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">Descanso entre series</span>
          <span id="timerStatus" style="font-size: 12px; color: var(--accent-orange);">Listo</span>
        </div>
        <div class="timer-display" id="timer">00:00</div>
        <div class="grid-3">
          <button class="btn-secondary" onclick="startTimer(60)">1 min</button>
          <button class="btn-secondary" onclick="startTimer(90)">1.5 min</button>
          <button class="btn-secondary" onclick="startTimer(120)">2 min</button>
        </div>
      </div>

      <!-- Formulario de Entrada -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">Detalles del Ejercicio</span>
        </div>

        <div class="form-group">
          <label>Grupo / Ejercicio</label>
          <input type="text" id="exercise" placeholder="Ej. Press de Banca, Sentadilla..." list="exercise-suggestions">
          <datalist id="exercise-suggestions">
            <option value="Press de Banca">
            <option value="Sentadilla">
            <option value="Peso Muerto">
            <option value="Press Militar">
            <option value="Dominadas">
            <option value="Remo con Barra">
          </datalist>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label>Peso Base / Barra (kg)</label>
            <input type="number" id="barWeight" value="20" oninput="calculateTotal()">
          </div>
          <div class="form-group">
            <label>Discos por Lado (kg)</label>
            <input type="number" id="sideWeight" placeholder="0" oninput="calculateTotal()">
          </div>
        </div>

        <div class="calc-box">
          <span style="font-size: 12px; color: var(--text-sub);">PESO TOTAL CARGADO</span><br>
          <span class="val" id="totalWeightDisplay">20</span> <span style="color:var(--accent-green); font-weight: 700;">KG</span>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label>Repeticiones</label>
            <input type="number" id="reps" placeholder="8">
          </div>
          <div class="form-group">
            <label>RPE (Esfuerzo 1-10)</label>
            <input type="number" id="rpe" placeholder="8" max="10">
          </div>
        </div>

        <button onclick="saveSet()">Guardar Serie</button>
      </div>
    </div>

    <!-- TAB 2: CALCULADORA DE DISCOS -->
    <div id="tab-calc" class="tab-content">
      <div class="card">
        <div class="card-header">
          <span class="card-title">Calculadora de Cargas</span>
        </div>
        <div class="form-group">
          <label>Peso Objetivo Total (kg)</label>
          <input type="number" id="targetWeight" placeholder="100" oninput="calculatePlates()">
        </div>
        <div class="form-group">
          <label>Peso de la Barra (kg)</label>
          <input type="number" id="calcBarWeight" value="20" oninput="calculatePlates()">
        </div>

        <div class="calc-box">
          <span style="font-size: 12px; color: var(--text-sub);">DISCOS A COLOCAR POR LADO</span>
          <div class="plates-container" id="platesBreakdown">
            <span style="font-size: 13px; color: var(--text-sub);">Ingresa un peso objetivo</span>
          </div>
        </div>
      </div>
    </div>

    <!-- TAB 3: HISTORIAL -->
    <div id="tab-history" class="tab-content">
      <div class="card">
        <div class="card-header">
          <span class="card-title">Registro de Series</span>
          <button class="btn-secondary btn-small" onclick="exportCSV()">Exportar Excel</button>
        </div>
        <div id="historyList">
          <p style="text-align:center; color: var(--text-sub); padding: 20px;">Sin registros guardados.</p>
        </div>
        <button class="btn-danger" style="margin-top: 15px;" onclick="clearAllData()">Borrar Todo el Historial</button>
      </div>
    </div>

    <!-- TAB 4: METRICAS -->
    <div id="tab-stats" class="tab-content">
      <div class="card">
        <div class="card-header">
          <span class="card-title">Resumen de Rendimiento</span>
        </div>
        <div class="grid-2">
          <div class="calc-box">
            <span style="font-size: 11px; color: var(--text-sub);">VOLUMEN ACUMULADO</span><br>
            <span class="val" id="statVolume">0</span> <span style="font-size: 12px;">KG</span>
          </div>
          <div class="calc-box">
            <span style="font-size: 11px; color: var(--text-sub);">TOTAL SERIES</span><br>
            <span class="val" id="statSets" style="color:var(--accent);">0</span>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- Navegación Inferior iOS -->
  <nav>
    <button class="nav-item active" onclick="switchTab('log', 'Registrar Serie', this)">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
      Registro
    </button>
    <button class="nav-item" onclick="switchTab('calc', 'Calculadora de Discos', this)">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 8h-4v2h4v2h-4v2h-2v-6h6v2zm-10 0h4v2H7v-2zm0-4h4v2H7V7zm0 10h4v2H7v-2z"/></svg>
      Discos
    </button>
    <button class="nav-item" onclick="switchTab('history', 'Historial', this)">
      <svg viewBox="0 0 24 24"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
      Historial
    </button>
    <button class="nav-item" onclick="switchTab('stats', 'Estadísticas', this)">
      <svg viewBox="0 0 24 24"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/></svg>
      Métricas
    </button>
  </nav>

  <script>
    // Cambio de Navegación
    function switchTab(tabId, title, btn) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + tabId).classList.add('active');
      btn.classList.add('active');
      document.getElementById('pageTitle').innerText = title;
      if(tabId === 'history') renderHistory();
      if(tabId === 'stats') renderStats();
    }

    // Calculadora Peso Total
    function calculateTotal() {
      const bar = parseFloat(document.getElementById('barWeight').value) || 0;
      const side = parseFloat(document.getElementById('sideWeight').value) || 0;
      const total = bar + (side * 2);
      document.getElementById('totalWeightDisplay').innerText = total;
    }

    // Guardar Serie y 1RM Estimado
    function saveSet() {
      const ex = document.getElementById('exercise').value;
      const weight = parseFloat(document.getElementById('totalWeightDisplay').innerText);
      const reps = parseInt(document.getElementById('reps').value);
      const rpe = document.getElementById('rpe').value;

      if (!ex || isNaN(reps) || reps <= 0) {
        alert("Por favor ingresa el nombre del ejercicio y las repeticiones.");
        return;
      }

      // Fórmula Epley 1RM: Peso * (1 + Reps/30)
      const e1RM = reps > 1 ? Math.round(weight * (1 + reps / 30)) : weight;

      const newLog = {
        id: Date.now(),
        ex,
        weight,
        reps,
        rpe,
        e1RM,
        date: new Date().toLocaleDateString(),
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };

      let logs = JSON.parse(localStorage.getItem('iron_logs') || '[]');
      logs.unshift(newLog);
      localStorage.setItem('iron_logs', JSON.stringify(logs));

      // Limpieza de Inputs
      document.getElementById('reps').value = '';
      document.getElementById('sideWeight').value = '';
      calculateTotal();
      
      alert("¡Serie registrada!");
    }

    // Calculadora Desglose de Discos
    function calculatePlates() {
      const target = parseFloat(document.getElementById('targetWeight').value) || 0;
      const bar = parseFloat(document.getElementById('calcBarWeight').value) || 0;
      const container = document.getElementById('platesBreakdown');

      if (target <= bar) {
        container.innerHTML = `<span style="font-size: 13px; color: var(--text-sub);">El peso objetivo debe ser mayor al de la barra.</span>`;
        return;
      }

      let weightPerSide = (target - bar) / 2;
      const availablePlates = [25, 20, 15, 10, 5, 2.5, 1.25];
      let result = [];

      availablePlates.forEach(plate => {
        while (weightPerSide >= plate) {
          result.push(plate);
          weightPerSide -= plate;
        }
      });

      if (result.length === 0) {
        container.innerHTML = `<span style="font-size: 13px; color: var(--text-sub);">No hay combinación exacta con discos estándar.</span>`;
      } else {
        container.innerHTML = result.map(p => `<span class="plate-badge">${p} kg</span>`).join('');
      }
    }

    // Cronómetro con Vibración
    let timerInterval;
    function startTimer(seconds) {
      clearInterval(timerInterval);
      let time = seconds;
      document.getElementById('timerStatus').innerText = "En curso...";

      timerInterval = setInterval(() => {
        const m = Math.floor(time / 60).toString().padStart(2, '0');
        const s = (time % 60).toString().padStart(2, '0');
        document.getElementById('timer').innerText = `${m}:${s}`;

        if (time <= 0) {
          clearInterval(timerInterval);
          document.getElementById('timerStatus').innerText = "¡Tiempo finalizado!";
          if (navigator.vibrate) navigator.vibrate([300, 100, 300]);
        }
        time--;
      }, 1000);
    }

    // Renderizar Historial
    function renderHistory() {
      const logs = JSON.parse(localStorage.getItem('iron_logs') || '[]');
      const container = document.getElementById('historyList');

      if (logs.length === 0) {
        container.innerHTML = `<p style="text-align:center; color: var(--text-sub); padding: 20px;">Sin registros guardados.</p>`;
        return;
      }

      container.innerHTML = logs.map(l => `
        <div class="log-item">
          <div class="log-info">
            <h3>${l.ex}</h3>
            <p>${l.reps} reps ${l.rpe ? '• RPE ' + l.rpe : ''} • EST. 1RM: ${l.e1RM}kg</p>
            <p style="font-size: 11px; color: var(--text-sub);">${l.date} - ${l.time}</p>
          </div>
          <div class="log-stats">
            <div class="log-weight">${l.weight} kg</div>
          </div>
        </div>
      `).join('');
    }

    // Renderizar Métricas
    function renderStats() {
      const logs = JSON.parse(localStorage.getItem('iron_logs') || '[]');
      let totalVolume = 0;
      logs.forEach(l => totalVolume += (l.weight * l.reps));

      document.getElementById('statVolume').innerText = totalVolume.toLocaleString();
      document.getElementById('statSets').innerText = logs.length;
    }

    // Exportar Datos a Excel (CSV)
    function exportCSV() {
      const logs = JSON.parse(localStorage.getItem('iron_logs') || '[]');
      if(logs.length === 0) return alert("No hay datos para exportar.");

      let csv = "Fecha,Hora,Ejercicio,Peso(kg),Repeticiones,RPE,1RM_Estimado\n";
      logs.forEach(l => {
        csv += `"${l.date}","${l.time}","${l.ex}",${l.weight},${l.reps},"${l.rpe || ''}",${l.e1RM}\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.setAttribute('href', url);
      a.setAttribute('download', `Entrenamientos_GYM_${new Date().toISOString().slice(0,10)}.csv`);
      a.click();
    }

    // Limpiar Datos
    function clearAllData() {
      if (confirm("¿Estás seguro de que deseas eliminar todo el historial acumulado?")) {
        localStorage.removeItem('iron_logs');
        renderHistory();
      }
    }
  </script>
</body>
</html>
